name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build and run all three generators
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile and QEMU deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-user

      # --- C++ ---
      - name: Build C++ generator
        run: |
          cmake -B generator/build generator -DCMAKE_BUILD_TYPE=Release
          cmake --build generator/build --parallel

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust generator
        run: cargo build --release --manifest-path rust-generator/Cargo.toml

      # --- Zig ---
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-linux-x86_64-0.16.0.tar.xz \
            | sudo tar xJ -C /usr/local/lib
          sudo ln -sf /usr/local/lib/zig-linux-x86_64-0.16.0/zig /usr/local/bin/zig
          zig version

      - name: Build Zig generator
        run: zig build -Doptimize=ReleaseFast
        working-directory: zig-generator

      # --- Run pipeline for each generator ---
      - name: Run pipeline (cpp)
        run: |
          python3 scripts/run.py \
            --generator cpp \
            --seed 0x1111111111111111 \
            --count 30 \
            --strategy forwarding_stress

      - name: Run pipeline (rust)
        run: |
          python3 scripts/run.py \
            --generator rust \
            --seed 0x1111111111111111 \
            --count 30 \
            --strategy forwarding_stress

      - name: Run pipeline (zig)
        run: |
          python3 scripts/run.py \
            --generator zig \
            --seed 0x1111111111111111 \
            --count 30 \
            --strategy forwarding_stress
